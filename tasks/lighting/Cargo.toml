[package]
name = "node75-lighting"
version = "0.1.0"
edition = "2024"

[dependencies]
node75-board-api = { path = "../../lib/board-api" }
node75-lighting-api = { path = "../../lib/lighting-api" }
node75-lighting-effects = { path = "../../lib/lighting-effects" }
userlib = { path = "../../vendor/exhubris/sys/userlib", features = ["no-panic-messages"] }
hubris-task-slots = { path = "../../vendor/exhubris/sys/task-slots" }

[[bin]]
name = "node75-lighting"
path = "src/main.rs"
