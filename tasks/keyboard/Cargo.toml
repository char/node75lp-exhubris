[package]
name = "node75-keyboard"
version = "0.1.0"
edition = "2024"

[dependencies]
hubpack = "0.1.2"
hubris-task-slots = { path = "../../vendor/exhubris/sys/task-slots" }
idyll_runtime = { path = "../../vendor/exhubris/sys/idyll_runtime" }
kipc = { path = "../../vendor/exhubris/sys/kipc" }
node75-keyboard-core = { path = "../../lib/keyboard-core" }
node75-keymap = { path = "../../lib/keymap" }
node75-usb = { path = "../../lib/usb" }
serde = { version = "1", default-features = false, features = ["derive"] }
userlib = { path = "../../vendor/exhubris/sys/userlib", features = ["no-panic-messages"] }

[build-dependencies]
hubris-build = { path = "../../vendor/exhubris/tools/build" }

[[bin]]
name = "node75-keyboard"
path = "src/main.rs"
